<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AdmAi"><link rel="manifest" href="manifest.json"><title>AdmAi</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827}.app{max-width:900px;margin:auto;min-height:100vh;padding-bottom:90px}header{background:#111827;color:#fff;padding:22px 20px 18px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:28px}.sub{opacity:.7;margin-top:4px}.search{margin-top:15px;width:100%;padding:14px;border:0;border-radius:12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 10px #0000000d;min-height:105px}.icon{font-size:28px}.title{font-weight:700;margin-top:8px}.desc{font-size:13px;color:#6b7280;margin-top:4px}.chat{margin:0 16px;background:#fff;border-radius:18px;padding:18px}.chat textarea{width:100%;min-height:90px;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px;resize:vertical}button{background:#111827;color:#fff;border:0;border-radius:12px;padding:13px 18px;margin-top:10px;font-size:15px}.quick{display:flex;gap:8px;overflow:auto;padding-top:10px}.quick button{white-space:nowrap;background:#eef0f3;color:#111827}#answer{margin-top:12px;padding:12px;background:#f3f4f6;border-radius:12px;display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:10px;display:flex;justify-content:space-around;z-index:10}nav button{margin:0;background:transparent;color:#111827;padding:8px;font-size:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><header><h1>AdmAi</h1><div class="sub">ANDRITZ Business Assistant</div><input class="search" placeholder="Müşteri, teklif, serial number ara..." oninput="search(this.value)"></header><section class="grid"><div class="card" onclick="ask('Müşteriler')"><div class="icon">👥</div><div class="title">Müşteriler</div><div class="desc">Müşteri ve proje bilgileri</div></div><div class="card" onclick="ask('Teklifler')"><div class="icon">💶</div><div class="title">Teklifler</div><div class="desc">Quote, fiyat ve GM</div></div><div class="card" onclick="ask('Maliyet')"><div class="icon">📊</div><div class="title">Maliyet</div><div class="desc">Birim maliyet modeli</div></div><div class="card" onclick="ask('Teknik')"><div class="icon">⚙️</div><div class="title">Teknik</div><div class="desc">Makine ve arızalar</div></div><div class="card" onclick="ask('Dosyalar')"><div class="icon">📁</div><div class="title">Dosyalar</div><div class="desc">Teknik dokümanlar</div></div><div class="card" onclick="ask('İngilizce')"><div class="icon">🇬🇧</div><div class="title">İngilizce</div><div class="desc">E-mail ve toplantı desteği</div></div></section><section class="chat"><h2>💬 AdmAi'ye Sor</h2><textarea id="q" placeholder="Örn: Karafiber'in son collecting apron teklifini göster."></textarea><button onclick="send()">Sor</button><div class="quick"><button onclick="ask('Karafiber son teklif')">Karafiber</button><button onclick="ask('Maliyet_2.xlsm')">Maliyet</button><button onclick="ask('Serial number')">Serial</button><button onclick="ask('İngilizce e-mail')">İngilizce</button></div><div id="answer"></div></section></div><nav><button onclick="scrollTo(0,0)">🏠<br>Ana Sayfa</button><button onclick="ask('Müşteriler')">👥<br>Müşteriler</button><button onclick="ask('Teklifler')">💶<br>Teklifler</button><button onclick="ask('Teknik')">⚙️<br>Teknik</button></nav><script>function ask(t){document.getElementById('q').value=t;send()}function send(){let q=document.getElementById('q').value.trim();if(!q)return;let a=document.getElementById('answer');a.style.display='block';a.innerHTML='<b>AdmAi:</b> '+escapeHtml(q)+'<br><br><span style="color:#6b7280">Arayüz hazır. Gerçek bilgi bankası bağlantısı sonraki aşamada eklenecek.</span>'}function search(v){if(v.length>1)document.getElementById('q').value=v}function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}</script></body></html>
